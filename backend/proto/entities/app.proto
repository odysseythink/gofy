syntax = "proto3";

package entities;

option go_package="github.com/odysseythink/gofy/backend/proto/entities;entities";


message Import  {
	string           id = 1;
	string           status = 2;
	string           app_id = 3;
	string           current_dsl_version = 4;
	string           imported_dsl_version = 5;
	string           error = 6;
}

message PendingData  {
	string import_mode = 1;
	string yaml_content = 2;
	string name = 3;
	string description = 4;
	string icon_type = 5;
	string icon = 6;
	string icon_background = 7;
	string app_id = 8;
}