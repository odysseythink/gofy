model: gpt-3.5-turbo
label:
  en_US: GPT-3.5 Turbo
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 16385
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 0.7
    min: 0.0
    max: 2.0
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 4096
  - name: top_p
    use_template: top_p
    type: float
    default: 1.0
    min: 0.0
    max: 1.0
  - name: frequency_penalty
    use_template: frequency_penalty
    type: float
    default: 0.0
    min: -2.0
    max: 2.0
  - name: presence_penalty
    use_template: presence_penalty
    type: float
    default: 0.0
    min: -2.0
    max: 2.0
  - name: response_format
    use_template: response_format
pricing:
  input: 0.5
  output: 1.5
  unit: 0.000001
  currency: USD
