provider: chatglm
label:
  zh_Hans: ChatGLM
  en_US: ChatGLM
icon_small:
  en_US: icon_s_en.svg
icon_large:
  en_US: icon_l_en.svg
background: "#F0F9FF"
help:
  title:
    en_US: How to deploy ChatGLM (OpenAI-compatible)
    zh_Hans: 如何部署 ChatGLM（OpenAI 兼容接口）
  url:
    en_US: https://github.com/THUDM/ChatGLM3
supported_model_types:
  - llm
configurate_methods:
  - customizable-model
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
  credential_form_schemas:
    - variable: api_base
      label:
        zh_Hans: API Base
        en_US: API Base
      type: text-input
      required: true
      placeholder:
        zh_Hans: Base URL, 例如 http://127.0.0.1:8000
        en_US: Base URL, e.g. http://127.0.0.1:8000
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: false
      placeholder:
        zh_Hans: 在此输入您的 API Key（可选）
        en_US: Enter your API Key (optional)
    - variable: context_size
      label:
        zh_Hans: 模型上下文长度
        en_US: Model context size
      required: false
      type: text-input
      default: '8192'
    - variable: max_tokens
      label:
        zh_Hans: 最大 token 上限
        en_US: Upper bound for max tokens
      default: '4096'
      type: text-input
      show_on:
        - variable: __model_type
          value: llm
