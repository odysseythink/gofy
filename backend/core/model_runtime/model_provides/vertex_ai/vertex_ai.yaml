provider: vertex_ai
label:
  zh_Hans: Vertex AI
  en_US: Vertex AI
icon_small:
  en_US: icon_s_en.svg
icon_large:
  en_US: icon_l_en.svg
background: "#E0E7FF"
help:
  title:
    en_US: Set up Vertex AI on Google Cloud
    zh_Hans: 在 Google Cloud 启用 Vertex AI
  url:
    en_US: https://cloud.google.com/vertex-ai
supported_model_types:
  - llm
  - text-embedding
configurate_methods:
  - customizable-model
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your Vertex AI model name (e.g. gemini-1.5-pro)
      zh_Hans: 输入 Vertex AI 模型名称（如 gemini-1.5-pro）
  credential_form_schemas:
    - variable: vertex_project_id
      label:
        zh_Hans: GCP 项目 ID
        en_US: GCP Project ID
      type: text-input
      required: true
      placeholder:
        zh_Hans: 在此输入 GCP 项目 ID
        en_US: Enter GCP Project ID
    - variable: vertex_location
      label:
        zh_Hans: 区域
        en_US: Location
      type: text-input
      required: true
      placeholder:
        zh_Hans: 例如 us-central1
        en_US: e.g. us-central1
    - variable: vertex_service_account_key
      label:
        zh_Hans: Service Account Key (JSON)
        en_US: Service Account Key (JSON)
      type: secret-input
      required: true
      placeholder:
        zh_Hans: 粘贴完整的 Service Account JSON
        en_US: Paste the full Service Account JSON
    - variable: context_size
      label:
        zh_Hans: 模型上下文长度
        en_US: Model context size
      required: false
      type: text-input
      default: '1048576'
    - variable: max_tokens
      label:
        zh_Hans: 最大 token 上限
        en_US: Upper bound for max tokens
      default: '8192'
      type: text-input
      show_on:
        - variable: __model_type
          value: llm
