provider: openai_api_compatible
label:
  zh_Hans: OpenAI API 兼容
  en_US: OpenAI API Compatible
background: "#E3F2FD"
help:
  title:
    en_US: Configure your OpenAI-compatible API endpoint
    zh_Hans: 配置您的 OpenAI 兼容 API 端点
  url:
    en_US: https://platform.openai.com/docs/api-reference
supported_model_types:
  - llm
  - text-embedding
configurate_methods:
  - customizable-model
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        zh_Hans: 在此输入您的 API Key
        en_US: Enter your API Key
    - variable: endpoint_url
      label:
        en_US: API Endpoint URL
        zh_Hans: API 端点 URL
      type: text-input
      required: true
      placeholder:
        zh_Hans: 输入 API 端点 URL，例如 https://api.openai.com/v1/
        en_US: "Enter API endpoint URL, e.g. https://api.openai.com/v1/"
    - variable: context_size
      label:
        zh_Hans: 模型上下文长度
        en_US: Model context size
      required: false
      type: text-input
      default: '4096'
      placeholder:
        zh_Hans: 在此输入您的模型上下文长度
        en_US: Enter your Model context size
    - variable: max_tokens
      label:
        zh_Hans: 最大 token 上限
        en_US: Upper bound for max tokens
      default: '4096'
      type: text-input
      show_on:
        - variable: __model_type
          value: llm
