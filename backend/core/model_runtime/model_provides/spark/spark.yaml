provider: spark
label:
  zh_Hans: 讯飞星火
  en_US: Spark
icon_small:
  en_US: icon_s_en.svg
icon_large:
  en_US: icon_l_en.svg
background: "#E0F2FE"
help:
  title:
    en_US: Get your API Password from iFLYTEK Spark (OpenAI-compatible)
    zh_Hans: 从讯飞星火获取 API Password（OpenAI 兼容接口）
  url:
    en_US: https://console.xfyun.cn/services/cbm
supported_model_types:
  - llm
configurate_methods:
  - customizable-model
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name (e.g. generalv3.5)
      zh_Hans: 输入模型名称（如 generalv3.5）
  credential_form_schemas:
    - variable: api_key
      label:
        zh_Hans: API Password
        en_US: API Password
      type: secret-input
      required: true
      placeholder:
        zh_Hans: 在此输入您的 API Password
        en_US: Enter your API Password
    - variable: context_size
      label:
        zh_Hans: 模型上下文长度
        en_US: Model context size
      required: false
      type: text-input
      default: '8192'
    - variable: max_tokens
      label:
        zh_Hans: 最大 token 上限
        en_US: Upper bound for max tokens
      default: '4096'
      type: text-input
      show_on:
        - variable: __model_type
          value: llm
