model: abab6.5s-chat
label:
  en_US: ABAB 6.5s
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 245760
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 0.9
    min: 0.01
    max: 1.0
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 2048
    min: 1
    max: 8192
  - name: top_p
    use_template: top_p
    type: float
    default: 0.95
    min: 0.0
    max: 1.0
pricing:
  input: 0.001
  output: 0.001
  unit: 0.001
  currency: RMB
