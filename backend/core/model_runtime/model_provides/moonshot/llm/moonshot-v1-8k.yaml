model: moonshot-v1-8k
label:
  en_US: Moonshot v1 8K
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 8000
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 0.3
    min: 0.0
    max: 1.0
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 2048
    min: 1
    max: 4096
  - name: top_p
    use_template: top_p
    type: float
    default: 1.0
    min: 0.0
    max: 1.0
pricing:
  input: 0.012
  output: 0.012
  unit: 0.001
  currency: RMB
