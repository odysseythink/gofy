syntax = "proto3";

package pbapi;

option go_package="mlib.com/gofy/server/proto/pbapi";

import "exceptions/exceptions.proto";

service datasets {
    rpc DatasetList (DatasetListRequest) returns (DatasetListReply) {}
    rpc ExternalKnowledgeApiList(ExternalKnowledgeApiListRequest) returns (ExternalKnowledgeApiListReply) {}
}

message DatasetListRequest {
  string account_id = 1;
  int32 page = 2;
  int32 limit = 3;
  repeated string ids = 4;
  string keyword = 5;
  repeated string tag_ids = 6;
  bool include_all = 7;
}
message DatasetListReply{
  exceptions.HTTPException exp = 1;
  string datasets_str = 2;
  bool has_more = 3;
  int32 limit = 4;
  int32 page = 5;
  int64 total = 6;
}
message ExternalKnowledgeApiListRequest {
  string current_tenant_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string keyword = 4;
}
message ExternalKnowledgeApiListReply{
  exceptions.HTTPException exp = 1;
  string datas_str = 2;
  bool has_more = 3;
  int32 limit = 4;
  int32 page = 5;
  int64 total = 6;
}