model: gemini-1.5-pro
label:
  en_US: Gemini 1.5 Pro
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 2097152
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 1.0
    min: 0.0
    max: 2.0
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 8192
  - name: top_p
    use_template: top_p
    type: float
    default: 0.95
    min: 0.0
    max: 1.0
  - name: top_k
    type: int
    default: 40
    min: 1
    max: 100
    label:
      zh_Hans: Top K
      en_US: Top K
pricing:
  input: 1.25
  output: 5.0
  unit: 0.000001
  currency: USD
