model: glm-4-plus
label:
  en_US: GLM-4-Plus
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 0.95
    min: 0.0
    max: 1.0
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 2048
    min: 1
    max: 4096
  - name: top_p
    use_template: top_p
    type: float
    default: 0.7
    min: 0.0
    max: 1.0
pricing:
  input: 0.05
  output: 0.05
  unit: 0.001
  currency: RMB
